name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same version as the generated skills, so CI and local validation agree.
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive
