version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # The test plugin pins the Wrangler version it was built with, so they move together.
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
    ignore:
      # The test plugin supports one Vitest major, so a new major waits for the plugin.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
