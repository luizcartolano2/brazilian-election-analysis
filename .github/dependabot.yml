version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # The test plugin pins the Wrangler version it was built with, so they move together.
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
    ignore:
      # The test plugin supports one Vitest major, so a new major waits for the plugin.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so a newer TypeScript waits for it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # eslint-plugin-react, through eslint-config-next, supports ESLint 9 only.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
